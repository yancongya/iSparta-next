<!DOCTYPE html>
<html lang="zh-CN" class="theme-dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>iSparta-next · 启动进度窗（独立预览）</title>
<style>
/* ============================================================================
   启动进度窗 · 单独预览页（dev only · 零依赖 · 不进打包产物）
   对应 Vue 侧 src/ui-next/views/BootSplash.vue + demos/BootDemo.vue + router#/boot。

   为什么单独一页：这一屏在真实产品里是**独立无边框小窗**，与指导弹窗不同时同屏。
   若塞进 index.html 的视图切换，就等于把它和指导摆在一起比，反而看不出
   「这是一扇单独的窗」以及「关掉它之后进入指导」的完整流转。

   用法：
     · 默认自动播放「读取配置 → 应用主题 → 检查扩展 → 就绪」四阶段；
     · 完成后停1 秒展示终态，按任意键 / 点「重新播放」回到开头；
     · 点「关闭并进入指导」直接跳 index.html 看接续效果。
   ========================================================================== */

/* ---------- 令牌：与 src/ui-next/styles/tokens.css 保持一致 ---------- */
:root,
.theme-dark{
  --is-bg:#0c0f0e;--is-panel:#121615;--is-elevated:#171d1b;--is-card:#141917;--is-inset:#1b2320;
  --is-text:#e8f0e6;--is-text-2:#a8b5ac;--is-text-3:#6f7d74;
  --is-border:rgba(232,240,230,.10);--is-border-strong:rgba(232,240,230,.18);--is-border-hi:rgba(232,240,230,.30);
  --is-track:rgba(232,240,230,.10);
  --is-accent:#c8f542;--is-accent-rgb:200,245,66;--is-on-accent:#0c0f0e;
  --is-ok:#3ddc97;
  --is-fs-xs:11px;--is-fs-sm:12px;--is-fs-base:13px;--is-fs-lg:15px;--is-fs-xl:18px;--is-fs-2xl:22px;
  --is-fw-semi:600;--is-fw-bold:700;
  --is-s-1:4px;--is-s-2:8px;--is-s-3:12px;--is-s-4:16px;--is-s-5:20px;--is-s-6:24px;--is-s-8:32px;--is-s-10:40px;
  --is-r-sm:4px;--is-r-md:8px;--is-r-lg:12px;--is-r-pill:999px;
  --is-dur-fast:120ms;--is-dur-base:200ms;--is-dur-slow:420ms;
  --is-ease-std:cubic-bezier(.4,0,.2,1);--is-ease-out:cubic-bezier(0,0,.2,1);--is-ease-spring:cubic-bezier(.34,1.56,.64,1);
  --is-shadow-lg:0 18px 48px rgba(0,0,0,.55);
}
.theme-light{
  --is-bg:#fafaf8;--is-panel:#ffffff;--is-elevated:#ffffff;--is-card:#ffffff;--is-inset:#f1f3f0;
  --is-text:#1c1917;--is-text-2:#57534e;--is-text-3:#8a837c;
  --is-border:rgba(28,25,23,.12);--is-border-strong:rgba(28,25,23,.20);--is-border-hi:rgba(28,25,23,.32);
  --is-track:rgba(28,25,23,.09);
  --is-accent:#c2410c;--is-accent-rgb:194,65,12;--is-on-accent:#ffffff;
  --is-ok:#15803d;
  --is-shadow-lg:0 18px 48px rgba(28,25,23,.16);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;padding:var(--is-s-6);
  background:var(--is-bg);color:var(--is-text);
  font:400 var(--is-fs-base)/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  display:flex;flex-direction:column;align-items:center;gap:var(--is-s-5);
  -webkit-font-smoothing:antialiased;
}

/* ---------- 页头（dev 工具条，非产品 UI） ---------- */
.bar{display:flex;align-items:center;gap:var(--is-s-2);flex-wrap:wrap;justify-content:center}
.btn{
  padding:6px 12px;border:1px solid var(--is-border-strong);border-radius:var(--is-r-pill);
  background:var(--is-elevated);color:var(--is-text-2);font:inherit;font-size:var(--is-fs-sm);
  cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;
  transition:border-color var(--is-dur-fast) var(--is-ease-std),color var(--is-dur-fast) var(--is-ease-std);
}
.btn:hover{border-color:var(--is-border-hi);color:var(--is-text)}
.btn--primary{border-color:var(--is-accent);color:var(--is-accent)}
.hint{font-size:var(--is-fs-xs);color:var(--is-text-3);text-align:center;margin:0}

/* ---------- 窗口：720×420 1:1 复刻主进程 BOOT_WIDTH/BOOT_HEIGHT ---------- */
.win{
  width:720px;max-width:100%;height:420px;
  display:flex;flex-direction:column;overflow:hidden;
  border-radius:var(--is-r-lg);
  border:1px solid var(--is-border-strong);
  background:var(--is-bg);
  box-shadow:var(--is-shadow-lg);
  transition:opacity var(--is-dur-base) var(--is-ease-std),transform var(--is-dur-base) var(--is-ease-out);
}
/* 终态「关闭」：整扇窗淡出缩小，模拟真实进程里 destroy 前的那一下 */
.win.is-closing{opacity:0;transform:scale(.96)}

.win-top{
  flex:0 0 44px;display:flex;align-items:center;padding:0 0 0 var(--is-s-5);
  background:var(--is-panel);border-bottom:1px solid var(--is-border);
}
.win-top__name{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:var(--is-s-2);font-size:var(--is-fs-sm);color:var(--is-text-3);overflow:hidden;white-space:nowrap}
/* logo 尺寸同 Home.vue 的 .ib-brand__mark（18px） */
.win-top__mark{flex:0 0 auto;display:flex;align-items:center}
.win-top__mark svg{display:block}
.win-top__text{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.win-win{display:flex;align-items:stretch;margin-left:auto}
.win-win__btn{
  width:46px;height:44px;display:flex;align-items:center;justify-content:center;
  border:0;background:transparent;color:var(--is-text-2);cursor:pointer;
  transition:background-color var(--is-dur-fast) var(--is-ease-std),color var(--is-dur-fast) var(--is-ease-std);
}
.win-win__btn svg{width:15px;height:15px}
.win-win__btn:hover{background:var(--is-inset);color:var(--is-text)}
.win-win__btn--danger:hover{background:#d93025;color:#fff}

.win-body{flex:1 1 auto;min-height:0;display:flex;overflow:hidden}
/* 内容栏 max-width 880：与指导 .ob-step 同口径，两窗内容栏宽看起来是一套 */
.win-pane{
  margin:auto;width:100%;max-width:880px;
  padding:var(--is-s-8) var(--is-s-8) var(--is-s-10);
  display:flex;flex-direction:column;align-items:center;text-align:center;
}

/* ---------- 五段式：插画 → 大标题 → 副文案 → 整幅细进度条 → 条下居中状态词 ---------- */
.art{display:flex;align-items:center;justify-content:center}
.art svg{width:126px;height:126px;display:block;overflow:visible}

.title{margin:42px 0 0;font-size:var(--is-fs-2xl);font-weight:var(--is-fw-bold);line-height:1.25;letter-spacing:-.01em;color:var(--is-text)}
.sub{margin:var(--is-s-3) 0 0;font-size:var(--is-fs-base);line-height:1.6;color:var(--is-text-2);text-wrap:balance}

/* 整幅细进度条：撑满内容栏，高 6px（实测参考图：轨道 x100–699 / 高 6px / 左右各留白 100px @800 宽） */
.bar-track{
  width:calc(100% - 144px);margin-left:72px;margin-top:var(--is-s-6);
  height:6px;border-radius:var(--is-r-pill);background:rgba(255,255,255,.09);overflow:hidden;
}
.bar-fill{height:100%;border-radius:var(--is-r-pill);background:var(--is-accent);transition:width var(--is-dur-slow) var(--is-ease-out);width:0}
/* 终态：整条填满并转 ok 色，和「就绪」文案对上 */
.win.is-done .bar-fill{background:var(--is-ok)}

/* 状态词：与轨道同宽、居中（实测参考图状态词中心 399.5 ≈ 画布中点 400） */
.status{
  width:calc(100% - 144px);margin:var(--is-s-3) 0 0;text-align:center;
  font-size:var(--is-fs-sm);line-height:1.6;color:var(--is-text-3);
}

/* ---------- 动效（插画：与 WelcomeDemo 同源几何） ---------- */
.ring,.orbit,.mark{transform-box:view-box;transform-origin:50% 50%}
.ring{opacity:.55;animation:bdFade 1.2s var(--is-ease-out) both}
.orbit{animation:bdOrbit 9s linear infinite}
.orbit .pulse{animation:bdPulse 2.6s var(--is-ease-std) infinite}
.mark{animation:bdPop .9s var(--is-ease-spring) .15s both}
@keyframes bdFade{from{opacity:0}to{opacity:.55}}
@keyframes bdOrbit{to{transform:rotate(360deg)}}
@keyframes bdPulse{0%,100%{opacity:1;transform:none}50%{opacity:.45;transform:scale(.82)}}
@keyframes bdPop{0%{transform:scale(.62);opacity:0}62%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}

/* 降低动效：环停转，但进度条/ 状态词照常，不能因为关掉动画就看不见进度 */
@media (prefers-reduced-motion:reduce){
  .ring,.orbit,.orbit .pulse,.mark{animation:none;opacity:1;transform:none}
  .bar-fill{transition:none}
  .win{transition:none}
}
</style>
</head>
<body>

<div class="bar">
  <button class="btn" id="replay">重新播放</button>
  <button class="btn" id="toggleTheme">切换主题</button>
  <a class="btn btn--primary" href="index.html" id="toGuide">关闭并进入指导 →</a>
</div>

<!-- 窗口：结构与 BootSplash.vue 一致 -->
<div class="win" id="win">
  <div class="win-top">
    <span class="win-top__name">
          <span class="win-top__mark" aria-hidden="true">
            <svg width="18" height="18" viewBox="0 0 1024 1024" fill="none">
              <g transform="translate(512 512) scale(2.05) translate(-512 -395.636364)">
                <path d="M512 395.636364m-232.727273 0a232.727273 232.727273 0 1 0 465.454546 0 232.727273 232.727273 0 1 0-465.454546 0Z" fill="#c8f542"/>
                <path d="M453.806545 289.764848a7.214545 7.214545 0 0 1 8.168728-6.112969l77.548606 11.155394c1.881212 0.271515 3.580121 1.272242 4.728242 2.788848l70.943031 93.796849a7.214545 7.214545 0 0 1 0.100848 8.564363L544.267636 498.722909a7.214545 7.214545 0 0 1-4.871757 2.936243L461.459394 512.391758a7.214545 7.214545 0 0 1-6.997333-11.132122l67.285333-101.558303a7.214545 7.214545 0 0 0-0.077576-8.079515L455.00897 294.888727a7.214545 7.214545 0 0 1-1.202425-5.12z m-6.729697 37.783273a3.607273 3.607273 0 0 1 5.054061 0.702061l47.736243 63.146666a3.607273 3.607273 0 0 1 0.104727 8.556607L452.189091 466.540606a3.607273 3.607273 0 0 1-6.543515-2.102303V330.426182a3.607273 3.607273 0 0 1 1.435151-2.878061z" fill="#0c0f0e"/>
              </g>
            </svg>
          </span>
          <span class="win-top__text" id="winTitle">iSparta-next 3.6.0</span>
        </span>
    <div class="win-win">
      <button class="win-win__btn" aria-label="最小化">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/></svg>
      </button>
      <button class="win-win__btn win-win__btn--danger" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
  </div>

  <div class="win-body">
    <div class="win-pane">
      <div class="art">
        <svg viewBox="0 0 132 132" fill="none" aria-hidden="true">
          <circle class="ring" cx="66" cy="66" r="54" stroke="var(--is-border-strong)" stroke-width="1.5"/>
          <g class="orbit"><circle class="pulse" cx="66" cy="12" r="4.5" fill="var(--is-accent)"/></g>
          <g class="mark">
            <g transform="translate(66 66) scale(0.1375) translate(-512 -395.636364)">
              <circle cx="512" cy="395.636364" r="232.727273" fill="var(--is-accent)"/>
              <path d="M512 395.636364m-232.727273 0a232.727273 232.727273 0 1 0 465.454546 0 232.727273 232.727273 0 1 0-465.454546 0Z" fill="var(--is-accent)"/>
              <path d="M453.806545 289.764848a7.214545 7.214545 0 0 1 8.168728-6.112969l77.548606 11.155394c1.881212 0.271515 3.580121 1.272242 4.728242 2.788848l70.943031 93.796849a7.214545 7.214545 0 0 1 0.100848 8.564363L544.267636 498.722909a7.214545 7.214545 0 0 1-4.871757 2.936243L461.459394 512.391758a7.214545 7.214545 0 0 1-6.997333-11.132122l67.285333-101.558303a7.214545 7.214545 0 0 0-0.077576-8.079515L455.00897 294.888727a7.214545 7.214545 0 0 1-1.202425-5.12z m-6.729697 37.783273a3.607273 3.607273 0 0 1 5.054061 0.702061l47.736243 63.146666a3.607273 3.607273 0 0 1 0.104727 8.556607L452.189091 466.540606a3.607273 3.607273 0 0 1-6.543515-2.102303V330.426182a3.607273 3.607273 0 0 1 1.435151-2.878061z" fill="var(--is-on-accent)"/>
            </g>
          </g>
        </svg>
      </div>

      <h1 class="title" data-i18n="title">正在准备</h1>
      <p class="sub" data-i18n="sub">首次启动要初始化环境与扩展，稍等一下就好</p>

      <div class="bar-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="track">
        <div class="bar-fill" id="fill"></div>
      </div>
      <p class="status" id="status" data-i18n="stage0">读取本地配置</p>
    </div>
  </div>
</div>

<p class="hint" data-i18n="hint">独立无边框窗 720×420 · 五段式：插画 → 大标题 → 副文案 → 整幅细进度条 → 条下居中状态词 · 顶栏标题与主窗同源</p>

<script>
/* 阶段与百分比：与 BootSplash.vue 的 STAGE_KEYS / STAGE_PCT 完全一致 */
var STAGES = [
  { key: 'stage0', pct: 25 },
  { key: 'stage1', pct: 50 },
  { key: 'stage2', pct: 80 },
  { key: 'stage3', pct: 100 }
]

var I18N = {
  'zh-CN': {
    title: '正在准备',
    sub: '首次启动要初始化环境与扩展，稍等一下就好',
    stage0: '读取本地配置',
    stage1: '应用主题与语言',
    stage2: '检查 AE 扩展',
    stage3: '就绪',
    done: '准备完成',
    hint: '独立无边框窗 720×420 · 五段式：插画 → 大标题 → 副文案 → 整幅细进度条 → 条下居中状态词 · 顶栏标题与主窗同源'
  },
  'en-US': {
    title: 'Preparing',
    sub: 'Setting up the environment and extensions for the first launch',
    stage0: 'Reading local settings',
    stage1: 'Applying theme and language',
    stage2: 'Checking AE extension',
    stage3: 'Ready',
    done: 'All set',
    hint: 'Standalone frameless window 720×420 · art → title → subtitle → full-width bar → centered status · top-bar title shared with the main window'
  }
}

var win = document.getElementById('win')
var fill = document.getElementById('fill')
var track = document.getElementById('track')
var statusEl = document.getElementById('status')

var reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches
var lang = 'zh-CN'
var timers = []

function T (key) { return (I18N[lang] || I18N['zh-CN'])[key] || key }

function applyI18n () {
  document.documentElement.lang = lang === 'en-US' ? 'en' : 'zh-CN'
  Array.prototype.slice.call(document.querySelectorAll('[data-i18n]')).forEach(function (el) {
    el.textContent = T(el.dataset.i18n)
  })
  document.title = 'iSparta-next · ' + T('title') + '（独立预览）'
}

function wait (ms) { return new Promise(function (r) { timers.push(setTimeout(r, ms)) }) }

function clearTimers () {
  timers.forEach(clearTimeout)
  timers = []
}

/** 跑完四个阶段 → 终态「就绪」→ 停住等用户（真实产品此时由主进程关窗进引导） */
async function play () {
  clearTimers()
  win.classList.remove('is-closing', 'is-done')
  fill.style.width = '0%'

  for (var i = 0; i < STAGES.length; i++) {
    statusEl.textContent = T(STAGES[i].key)
    await wait(reduced ? 120 : 700)
    fill.style.width = STAGES[i].pct + '%'
    track.setAttribute('aria-valuenow', String(STAGES[i].pct))
    await wait(reduced ? 60 : 170)
  }

  win.classList.add('is-done')
  statusEl.textContent = T('done')
  track.setAttribute('aria-valuenow', '100')
}

/** 模拟主进程 destroy：整扇窗淡出，然后露出「已关闭，进入指导」 */
async function closeWin () {
  clearTimers()
  win.classList.add('is-closing')
  await wait(reduced ? 100 : 380)
  statusEl.textContent = T('done') + ' · window closed'
}

document.getElementById('replay').addEventListener('click', play)
document.getElementById('toGuide').addEventListener('click', function (e) {
  e.preventDefault()
  closeWin()
})
document.getElementById('toggleTheme').addEventListener('click', function () {
  var root = document.documentElement
  root.classList.toggle('theme-dark')
  root.classList.toggle('theme-light')
})
document.addEventListener('keydown', function (e) {
  if (e.key === 'r' || e.key === 'R') { play() }
})

// 模拟主进程 ipcMain.handle('boot:info') 推来的标题（真实实现见 background.js）
// 顶栏标题与主窗同源：app.getName() + ' ' + app.getVersion()
document.getElementById('winTitle').textContent = 'iSparta-next 3.6.0'

applyI18n()
play()
</script>
</body>
</html>
