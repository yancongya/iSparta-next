<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="680" viewBox="0 0 1120 680" role="img" aria-labelledby="title desc">
<!-- [INPUT]: Electron 主进程/预加载/渲染进程、共享转换核、原生 CLI、AE CEP 双端。 -->
<!-- [OUTPUT]: iSparta-next 极客像素风架构图，供 README 使用。 -->
<!-- [POS]: 自包含工程图；连线对应真实 IPC / 桥 / 执行边界。 -->
<title id="title">iSparta-next 架构</title>
<desc id="desc">Vue 渲染进程经 preload IPC 白名单与 Electron 主进程通信。主进程负责文件与进程能力，驱动共享转换核，再调用原生 CLI。同一套 Vue 界面与转换核通过宿主/源适配器与 JSX 运行在 After Effects CEP 扩展中。</desc>
<defs>
  <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
    <rect width="2" height="2" fill="#222a2c"/>
  </pattern>
</defs>
<rect width="1120" height="680" fill="#101518"/>
<rect width="1120" height="680" fill="url(#grid)"/>

<!-- 标题 -->
<g fill="#fff4df" font-family="ui-monospace,SFMono-Regular,Consolas,'PingFang SC','Microsoft YaHei',monospace">
  <text x="40" y="44" font-size="18" font-weight="bold">$ cat architecture.map</text>
</g>

<!-- 连线 -->
<g fill="none" stroke="#d76a3e" stroke-width="4" shape-rendering="crispEdges">
  <path d="M300 160H420"/>
  <path d="M692 160H812"/>
  <path d="M948 208V272"/>
  <path d="M692 336H420"/>
  <path d="M948 396V460"/>
  <path d="M172 208V460"/>
  <path d="M300 496H420"/>
  <path d="M692 496H812"/>
</g>
<!-- 箭头 -->
<g fill="#d76a3e" shape-rendering="crispEdges">
  <path d="M420 152V168L432 160Z"/>
  <path d="M812 152V168L824 160Z"/>
  <path d="M940 272H956L948 284Z"/>
  <path d="M420 328V344L408 336Z"/>
  <path d="M940 460H956L948 472Z"/>
  <path d="M164 460H180L172 472Z"/>
  <path d="M420 488V504L432 496Z"/>
  <path d="M812 488V504L824 496Z"/>
</g>

