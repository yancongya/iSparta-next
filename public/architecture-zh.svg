  <text x="56" y="166" fill="#b4c0b8" font-size="12">ui-next + 业务组件</text>
  <text x="56" y="184" fill="#b4c0b8" font-size="12">任务列表 / 输出设置</text>
  <text x="56" y="202" fill="#b4c0b8" font-size="12">对比 / 主题 / 多语言</text>
</g>

