<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>iSparta</title>
<link href="js/chunk-common.js" rel="preload" as="script"><link href="js/chunk-vendors.js" rel="preload" as="script"><link href="js/index.js" rel="preload" as="script"></head>
<body>
  <div id="app"></div>
  <script>
    window.__ispartaBootErr = ''
    window.addEventListener('error', function (e) {
      window.__ispartaBootErr = (e && e.message) || 'unknown error'
    })
    window.addEventListener('unhandledrejection', function (e) {
      window.__ispartaBootErr = String((e && e.reason && (e.reason.message || e.reason)) || 'unhandledrejection')
    })
  </script>
  <script>
    (function () {
      var http = location.protocol === 'http:' || location.protocol === 'https:'
      var base = http ? '/lib/' : '../lib/'
      document.write('<script src="' + base + 'cep-bridge.js"><\/script>')
      document.write('<script src="' + base + 'forge.js"><\/script>')
      document.write('<script src="' + base + 'cs.js"><\/script>')
    })()
  </script>
  <script>
    // #app 空白 ≠ 桥丢失。不自动 reload（会循环）；只提示看控制台。
    window.addEventListener('DOMContentLoaded', function () {
      setTimeout(function () {
        var el = document.getElementById('app')
        if (el && el.childElementCount === 0) {
          el.innerHTML = '<p style="color:#c95;font:12px monospace;padding:12px;word-break:break-all">界面未挂载<br>err=' +
            (window.__ispartaBootErr || '(none)') +
            '<br>bridge ispartaAPI=' + !!window.ispartaAPI + ' cepBridge=' + !!window.ispartaCepBridge + '</p>'
        }
      }, 2500)
    })
  </script>
<script type="text/javascript" src="js/chunk-vendors.js"></script><script type="text/javascript" src="js/chunk-common.js"></script><script type="text/javascript" src="js/index.js"></script></body>
</html>
