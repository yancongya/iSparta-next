name: Build Multi-Platform

# 日常 CI：push master / 手动跑，只构建并上传 Artifact，不创建 Release。
# 正式发版：本地 scripts/release.ps1 或 Actions → Release（release.yml）。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            flag: --win
            asset_suffix: win-x64
          - os: ubuntu-latest
            platform: linux
            flag: --linux
            asset_suffix: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      # electron-chromedriver(spectron 传递依赖)在部分平台会下载失败并中断安装，
      # 故跳过所有安装脚本，随后单独安装 electron 运行时二进制
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install electron binary
        run: node node_modules/electron/install.js

      - name: Build ${{ matrix.platform }}
        run: npx vue-cli-service electron:build ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect & rename assets
        shell: bash
        env:
          SUFFIX: ${{ matrix.asset_suffix }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          shopt -s nullglob
          for f in dist_electron/*.dmg dist_electron/*.zip dist_electron/*.tar.gz dist_electron/*.exe dist_electron/*.AppImage; do
            cp "$f" release/
          done
          for f in release/*; do
            base="$(basename "$f")"
            ext="${base##*.}"
            case "$ext" in
              zip|gz|exe|dmg|AppImage)
                if [[ "$base" == *.tar.gz ]]; then
                  mv "$f" "release/isparta-${VERSION}-${SUFFIX}.tar.gz"
                else
                  mv "$f" "release/isparta-${VERSION}-${SUFFIX}.${ext}"
                fi
                ;;
            esac
          done
          ls -lh release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isparta-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: release/*
