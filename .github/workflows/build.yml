name: Build Multi-Platform

# 日常 CI：push master / 手动跑，只构建并上传 Artifact，不创建 Release。
# 正式发版：本地 scripts/release.ps1 或 Actions → Release（release.yml）。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cep-payload:
    name: Build shared CEP payload
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install electron binary
        run: node node_modules/electron/install.js
      - name: Build CEP UI and payload
        run: |
          npm run build:cep
          npm run prepare:cep
      - name: Archive shared CEP payload
        run: tar -czf shared-cep-payload.tar.gz -C . build/cep-payload
      - name: Upload shared CEP payload
        uses: actions/upload-artifact@v4
        with:
          name: shared-cep-payload
          path: shared-cep-payload.tar.gz
          if-no-files-found: error
          retention-days: 7

  build:
    needs: cep-payload
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            flag: --win
          - os: ubuntu-latest
            platform: linux
            flag: --linux
          - os: macos-latest
            platform: mac
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # 截图防漂移：docs/screenshots/ 是唯一真相源，landing/assets/shots/ 是它的副本。
      # 漏同步会让 Pages 上的图停在旧版，故在构建前拦住（纯 node，无需装依赖）。
      - name: Check screenshots in sync
        run: node scripts/sync-screenshots.js --check

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install electron binary
        run: node node_modules/electron/install.js

      - name: Download shared CEP payload
        uses: actions/download-artifact@v5
        with:
          name: shared-cep-payload
          path: .

      - name: Extract shared CEP payload
        run: tar -xzf shared-cep-payload.tar.gz

      - name: Doctor packaging assets
        run: node scripts/doctor-packaging.js

      - name: Build ${{ matrix.platform }}
        run: npx vue-cli-service electron:build ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS unified installer
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          node scripts/build-mac-pkg.js --arch x64
          node scripts/build-mac-pkg.js --arch arm64

      - name: Collect & rename assets
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          shopt -s nullglob
          for f in dist_electron/*.dmg dist_electron/*.pkg dist_electron/*.zip dist_electron/*.tar.gz dist_electron/*.exe dist_electron/*.AppImage; do
            # 跳过 blockmap / yml 等更新元数据（上面 glob 本身不含，但保险）
            cp "$f" release/
          done
          count=$(ls -1 release 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "No build artifacts found under dist_electron" >&2
            ls -la dist_electron || true
            exit 1
          fi
          for f in release/*; do
            base="$(basename "$f")"
            lower="$(echo "$base" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lower" == *.tar.gz ]]; then
              ext="tar.gz"
            else
              ext="${base##*.}"
            fi
            if [[ "$PLATFORM" == "mac" ]]; then
              if [[ "$lower" == *arm64* ]]; then
                dest="isparta-next-${VERSION}-mac-arm64.${ext}"
              elif [[ "$lower" == *x64* || "$lower" == *x86_64* || "$lower" == *intel* ]]; then
                dest="isparta-next-${VERSION}-mac-x64.${ext}"
              else
                dest="isparta-next-${VERSION}-mac-x64.${ext}"
              fi
            elif [[ "$PLATFORM" == "win" ]]; then
              dest="isparta-next-${VERSION}-win-x64.${ext}"
            else
              dest="isparta-next-${VERSION}-linux-x64.${ext}"
            fi
            # 产物名已符合目标命名时 mv 同路径会报 "same file"，跳过
            if [ "$(basename "$f")" != "$dest" ]; then
              mv "$f" "release/$dest"
            fi
          done
          ls -lh release

      - name: Write macOS pkg update manifest
        if: matrix.platform == 'mac'
        run: node scripts/write-mac-pkg-manifest.js

      - name: Audit bundle size
        run: node scripts/audit-bundle-size.js --dir release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isparta-next-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: release/*

  # CEP 扩展 zip（W4）：从 targets/cep 打可分发包，与桌面 Artifact 并列上传。
  # 约定（与 W3 / Release 资产一致）：
  #   源目录  targets/cep/
  #   编码器  public/bin 子集 → zip 内 bin/<plat>/（apngasm/apngquant/apngopt/cwebp/webpmux）
  #   根目录  io.github.isparta-next/（Extension Id，解压即为 CEP extensions 目录项）
  #   文件名  isparta-next-${version}-cep-${platform}.zip
  # AE 仅 Win/mac，故只打这两端；日常 build 不建 Release。
  cep:
    needs: cep-payload
    name: Pack CEP (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            bin_plats: 'win32 win64'
          - platform: mac
            bin_plats: 'mac'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'


      - name: Install dependencies (fresh)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Install electron binary
        # --ignore-scripts 跳过了 electron postinstall；vue-cli 加载 electron-builder
        # 插件时 require('electron') 需要二进制已就位（与上方 Build 任务一致）
        run: node node_modules/electron/install.js

      - name: Download shared CEP payload
        uses: actions/download-artifact@v5
        with:
          name: shared-cep-payload
          path: .

      - name: Extract shared CEP payload
        run: tar -xzf shared-cep-payload.tar.gz

      - name: Pack CEP extension zip
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node scripts/pack-cep-zip.js --platform "$PLATFORM" --prepared
          mkdir -p release
          VERSION=$(node -p "require('./package.json').version")
          cp "dist/isparta-next-cep-${VERSION}-${PLATFORM}-x64.zip" "release/isparta-next-${VERSION}-cep-${PLATFORM}.zip"

      - name: Upload CEP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isparta-next-cep-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: release/*
