name: Build Multi-Platform

# 日常 CI：push master / 手动跑，只构建并上传 Artifact，不创建 Release。
# 正式发版：本地 scripts/release.ps1 或 Actions → Release（release.yml）。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            flag: --win
          - os: ubuntu-latest
            platform: linux
            flag: --linux
          - os: macos-latest
            platform: mac
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Doctor packaging assets
        run: node scripts/doctor-packaging.js

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install electron binary
        run: node node_modules/electron/install.js

      - name: Build ${{ matrix.platform }}
        run: npx vue-cli-service electron:build ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect & rename assets
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          shopt -s nullglob
          for f in dist_electron/*.dmg dist_electron/*.zip dist_electron/*.tar.gz dist_electron/*.exe dist_electron/*.AppImage; do
            # 跳过 blockmap / yml 等更新元数据（上面 glob 本身不含，但保险）
            cp "$f" release/
          done
          count=$(ls -1 release 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "No build artifacts found under dist_electron" >&2
            ls -la dist_electron || true
            exit 1
          fi
          for f in release/*; do
            base="$(basename "$f")"
            lower="$(echo "$base" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lower" == *.tar.gz ]]; then
              ext="tar.gz"
            else
              ext="${base##*.}"
            fi
            if [[ "$PLATFORM" == "mac" ]]; then
              if [[ "$lower" == *arm64* ]]; then
                dest="isparta-next-${VERSION}-mac-arm64.zip"
              elif [[ "$lower" == *x64* || "$lower" == *x86_64* || "$lower" == *intel* ]]; then
                dest="isparta-next-${VERSION}-mac-x64.zip"
              else
                dest="isparta-next-${VERSION}-mac-x64.zip"
              fi
            elif [[ "$PLATFORM" == "win" ]]; then
              dest="isparta-next-${VERSION}-win-x64.${ext}"
            else
              dest="isparta-next-${VERSION}-linux-x64.${ext}"
            fi
            mv "$f" "release/$dest"
          done
          ls -lh release

      - name: Audit bundle size
        run: node scripts/audit-bundle-size.js --dir release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isparta-next-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: release/*

  # CEP 扩展 zip（W4）：从 targets/cep 打可分发包，与桌面 Artifact 并列上传。
  # 约定（与 W3 / Release 资产一致）：
  #   源目录  targets/cep/
  #   编码器  public/bin 子集 → zip 内 bin/<plat>/（apngasm/apngquant/apngopt/cwebp/webpmux）
  #   根目录  io.github.isparta-next/（Extension Id，解压即为 CEP extensions 目录项）
  #   文件名  isparta-next-${version}-cep-${platform}.zip
  # AE 仅 Win/mac，故只打这两端；日常 build 不建 Release。
  cep:
    name: Pack CEP (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            bin_plats: 'win32 win64'
          - platform: mac
            bin_plats: 'mac'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'


      - name: Build CEP UI (fresh)
        shell: bash
        run: |
          set -euo pipefail
          # 必须先构建 UI：targets/cep/ui/js 入库产物可能过时，zip 内不许带旧包
          npm ci --ignore-scripts
          npm run build:cep
      - name: Pack CEP extension zip
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          BIN_PLATS: ${{ matrix.bin_plats }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          STAGE_ID='io.github.isparta-next'
          STAGE=".cep-stage/${STAGE_ID}"

          if [ ! -d targets/cep ]; then
            echo "targets/cep missing — CEP sources not present" >&2
            exit 1
          fi

          rm -rf .cep-stage
          mkdir -p "${STAGE}"

          # 可分发文件：整棵 targets/cep，排除开发垃圾
          rsync -a \
            --exclude '.DS_Store' \
            --exclude 'Thumbs.db' \
            --exclude 'desktop.ini' \
            --exclude '*.log' \
            --exclude '*.tmp' \
            --exclude 'node_modules/' \
            --exclude '.git/' \
            --exclude '.gitignore' \
            --exclude '.vscode/' \
            --exclude '.idea/' \
            targets/cep/ "${STAGE}/"

          # 编码器小工具子集（见 targets/cep/bin/README.md）；不入库二进制，CI 从 public/bin 播种
          rm -rf "${STAGE}/bin"
          for bp in ${BIN_PLATS}; do
            mkdir -p "${STAGE}/bin/${bp}"
            for tool in apngasm apngquant apngopt cwebp webpmux; do
              for cand in "public/bin/${bp}/${tool}" "public/bin/${bp}/${tool}.exe"; do
                if [ -f "${cand}" ]; then
                  cp -f "${cand}" "${STAGE}/bin/${bp}/"
                fi
              done
            done
            if [ "${PLATFORM}" = 'mac' ]; then
              chmod +x "${STAGE}/bin/${bp}/"* 2>/dev/null || true
            fi
          done

          mkdir -p release
          DEST="isparta-next-${VERSION}-cep-${PLATFORM}.zip"
          (cd .cep-stage && zip -r -q "../release/${DEST}" "${STAGE_ID}")
          ls -lh release
          echo "Packed ${DEST} (version=${VERSION})"

      - name: Upload CEP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isparta-next-cep-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: release/*
