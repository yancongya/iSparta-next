name: Build Multi-Platform

# 日常 CI：push master / 手动跑，只构建并上传 Artifact，不创建 Release。
# 正式发版：本地 scripts/release.ps1 或 Actions → Release（release.yml）。

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            flag: --win
          - os: ubuntu-latest
            platform: linux
            flag: --linux
          - os: macos-latest
            platform: mac
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install electron binary
        run: node node_modules/electron/install.js

      - name: Build ${{ matrix.platform }}
        run: npx vue-cli-service electron:build ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect & rename assets
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release
          shopt -s nullglob
          for f in dist_electron/*.dmg dist_electron/*.zip dist_electron/*.tar.gz dist_electron/*.exe dist_electron/*.AppImage; do
            # 跳过 blockmap / yml 等更新元数据（上面 glob 本身不含，但保险）
            cp "$f" release/
          done
          count=$(ls -1 release 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "No build artifacts found under dist_electron" >&2
            ls -la dist_electron || true
            exit 1
          fi
          for f in release/*; do
            base="$(basename "$f")"
            lower="$(echo "$base" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lower" == *.tar.gz ]]; then
              ext="tar.gz"
            else
              ext="${base##*.}"
            fi
            if [[ "$PLATFORM" == "mac" ]]; then
              if [[ "$lower" == *arm64* ]]; then
                dest="isparta-${VERSION}-mac-arm64.zip"
              elif [[ "$lower" == *x64* || "$lower" == *x86_64* || "$lower" == *intel* ]]; then
                dest="isparta-${VERSION}-mac-x64.zip"
              else
                dest="isparta-${VERSION}-mac-x64.zip"
              fi
            elif [[ "$PLATFORM" == "win" ]]; then
              dest="isparta-${VERSION}-win-x64.${ext}"
            else
              dest="isparta-${VERSION}-linux-x64.${ext}"
            fi
            mv "$f" "release/$dest"
          done
          ls -lh release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isparta-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 7
          path: release/*
