name: Deploy Landing to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'landing/**'
      - '.github/workflows/pages.yml'
      # 发版 bump 会改 package.json，触发落地页重建以刷新兜底版本
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Bake landing releases.json
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISPARTA_UPDATE_REPO: ${{ github.repository }}
        run: node scripts/bake-landing.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload landing
        uses: actions/upload-pages-artifact@v3
        with:
          path: landing

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
