name: Release

# 设计约定（本地 CLI 触发 + 云端 CI/CD 打包）：
#   本地只负责：gh workflow run release.yml -f bump=...
#   版本号、tag、Win/Linux/macOS 构建、挂 Release 全部在 GitHub Actions 完成。
# 不用「push tag 触发另一条 workflow」：GITHUB_TOKEN 推送不会二次触发 CI（防递归）。

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本号递增类型'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      prerelease:
        description: '标记为 Pre-release（测试包可勾选；正式版保持不勾）'
        type: boolean
        default: false
      dry_run:
        description: '试运行：算版本并构建，但不提交、不打 tag、不创建 Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      published: ${{ steps.bump.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute & write version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const bumpType = (process.env.BUMP || 'patch').toLowerCase()
          const dryRun = String(process.env.DRY_RUN).toLowerCase() === 'true'

          const pkgPath = path.join(process.cwd(), 'package.json')
          const lockPath = path.join(process.cwd(), 'package-lock.json')
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))

          const cur = pkg.version
          const parts = String(cur).split('.').map(n => parseInt(n, 10))
          if (parts.length !== 3 || parts.some(n => !Number.isFinite(n) || n < 0)) {
            console.error('Invalid package.json version: ' + cur)
            process.exit(1)
          }

          let [maj, min, pat] = parts
          if (bumpType === 'major') { maj += 1; min = 0; pat = 0 }
          else if (bumpType === 'minor') { min += 1; pat = 0 }
          else if (bumpType === 'patch') { pat += 1 }
          else {
            console.error('Unsupported bump: ' + bumpType)
            process.exit(1)
          }

          const version = [maj, min, pat].join('.')
          const tag = 'v' + version

          pkg.version = version
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')

          if (fs.existsSync(lockPath)) {
            const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'))
            if ('version' in lock) lock.version = version
            if (lock.packages && lock.packages['']) lock.packages[''].version = version
            fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n')
          }

          const out = process.env.GITHUB_OUTPUT || ''
          fs.appendFileSync(out, `version=${version}\n`)
          fs.appendFileSync(out, `tag=${tag}\n`)
          fs.appendFileSync(out, `published=${dryRun ? 'false' : 'true'}\n`)
          console.log(`Version: ${cur} -> ${version} (dry_run=${dryRun})`)
          NODE

      - name: Resolve previous tag
        id: prev
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 --exclude="${NEW_TAG}" 2>/dev/null || true)
          echo "prev_tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV:-none}"

      - name: Commit & tag
        if: ${{ inputs.dry_run != true }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin HEAD
          git push origin "refs/tags/${TAG}"

      - name: Generate release notes (bot summary)
        if: ${{ inputs.dry_run != true }}
        id: notes
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          PREV_TAG: ${{ steps.prev.outputs.prev_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 自动汇总上一 tag → 本次 HEAD（不含版本号提交本身，取父提交区间）
          RANGE="${PREV_TAG}..HEAD^"
          if [ -z "$PREV_TAG" ]; then
            RANGE=""
          fi
          {
            echo "## 更新说明 / What's Changed"
            echo ""
            echo "版本 \`${TAG}\` · 由 CI 根据 commit 自动汇总"
            echo ""
          } > release-notes.md

          dump_section () {
            local title="$1"
            local pattern="$2"
            local body
            if [ -n "$RANGE" ]; then
              body=$(git log $RANGE --pretty=format:'- %s (%h)' --no-merges --extended-regexp --regexp-ignore-case --grep="$pattern" || true)
            else
              body=$(git log --pretty=format:'- %s (%h)' --no-merges --extended-regexp --regexp-ignore-case --grep="$pattern" || true)
            fi
            if [ -n "$body" ]; then
              echo "### $title" >> release-notes.md
              echo "$body" >> release-notes.md
              echo "" >> release-notes.md
            fi
          }

          dump_section "新功能 Features" '^feat(\([^)]+\))?:'
          dump_section "修复 Fixes" '^fix(\([^)]+\))?:'
          dump_section "文档 Docs" '^docs(\([^)]+\))?:'
          dump_section "工程 / CI" '^(ci|build|chore|refactor|perf|test)(\([^)]+\))?:'

          # 其余（无前缀）
          if [ -n "$RANGE" ]; then
            other=$(git log $RANGE --pretty=format:'- %s (%h)' --no-merges --extended-regexp --regexp-ignore-case --invert-grep --grep='^(feat|fix|docs|ci|build|chore|refactor|perf|test)(\([^)]+\))?:' || true)
          else
            other=$(git log --pretty=format:'- %s (%h)' --no-merges --extended-regexp --regexp-ignore-case --invert-grep --grep='^(feat|fix|docs|ci|build|chore|refactor|perf|test)(\([^)]+\))?:' || true)
          fi
          if [ -n "$other" ]; then
            echo "### 其他 Other" >> release-notes.md
            echo "$other" >> release-notes.md
            echo "" >> release-notes.md
          fi

          {
            echo "---"
            echo ""
            echo "## Installers"
            echo ""
            echo "| Platform | Asset |"
            echo "| --- | --- |"
            echo "| Windows x64 | \`isparta-next-${VERSION}-win-x64.zip\` |"
            echo "| Linux x64 | \`isparta-next-${VERSION}-linux-x64.tar.gz\` |"
            echo "| macOS arm64 | \`isparta-next-${VERSION}-mac-arm64.zip\` |"
            echo "| macOS x64 | \`isparta-next-${VERSION}-mac-x64.zip\` |"
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
            else
              echo "**Commits**: https://github.com/${REPO}/commits/${TAG}"
            fi
            echo ""
            echo "> macOS 为 CI 未签名构建。若 Gatekeeper 拦截：系统设置 → 隐私与安全性中允许，或对 App 执行 \`xattr -dr com.apple.quarantine\`。"
          } >> release-notes.md

          echo "----- notes -----"
          cat release-notes.md

      - name: Upload release notes
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          retention-days: 7
          path: release-notes.md

  build:
    name: Build (${{ matrix.platform }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            flag: --win
          - os: ubuntu-latest
            platform: linux
            flag: --linux
          - os: macos-latest
            platform: mac
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.published == 'true' && needs.version.outputs.tag || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install electron binary
        run: node node_modules/electron/install.js

      - name: Build ${{ matrix.platform }}
        run: npx vue-cli-service electron:build ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect & rename assets
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          for f in dist_electron/*.dmg dist_electron/*.zip dist_electron/*.tar.gz dist_electron/*.exe dist_electron/*.AppImage; do
            cp "$f" release/
          done
          count=$(ls -1 release 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "No build artifacts found under dist_electron" >&2
            ls -la dist_electron || true
            exit 1
          fi
          for f in release/*; do
            base="$(basename "$f")"
            lower="$(echo "$base" | tr '[:upper:]' '[:lower:]')"
            if [[ "$lower" == *.tar.gz ]]; then
              ext="tar.gz"
            else
              ext="${base##*.}"
            fi
            if [[ "$PLATFORM" == "mac" ]]; then
              if [[ "$lower" == *arm64* ]]; then
                dest="isparta-next-${VERSION}-mac-arm64.zip"
              elif [[ "$lower" == *x64* || "$lower" == *x86_64* || "$lower" == *intel* ]]; then
                dest="isparta-next-${VERSION}-mac-x64.zip"
              else
                # electron-builder 的 x64 包常不带架构后缀
                dest="isparta-next-${VERSION}-mac-x64.zip"
              fi
            elif [[ "$PLATFORM" == "win" ]]; then
              dest="isparta-next-${VERSION}-win-x64.${ext}"
            else
              dest="isparta-next-${VERSION}-linux-x64.${ext}"
            fi
            mv "$f" "release/$dest"
          done
          ls -lh release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isparta-next-release-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: [version, build]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Separate notes from installers
        run: |
          set -euo pipefail
          mkdir -p notes
          if [ -f dist/release-notes.md ]; then
            mv dist/release-notes.md notes/release-notes.md
          else
            cat > notes/release-notes.md <<EOF
          ## ${{ needs.version.outputs.tag }}

          Installers are attached below.
          EOF
          fi
          echo "Installers:"
          ls -lh dist
          echo "Notes head:"
          head -n 20 notes/release-notes.md

      # 稳定文件名别名：供落地页 releases/latest/download/<stable> 固定链接
      - name: Add stable-named aliases
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          VER="${VERSION}"
          copy_stable() {
            src="$1"; dest="$2"
            if [ -f "dist/$src" ]; then
              cp -f "dist/$src" "dist/$dest"
              echo "alias $src -> $dest"
            fi
          }
          copy_stable "isparta-next-${VER}-win-x64.zip" "isparta-next-win-x64.zip"
          copy_stable "isparta-next-${VER}-linux-x64.tar.gz" "isparta-next-linux-x64.tar.gz"
          copy_stable "isparta-next-${VER}-mac-arm64.zip" "isparta-next-mac-arm64.zip"
          copy_stable "isparta-next-${VER}-mac-x64.zip" "isparta-next-mac-x64.zip"
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: notes/release-notes.md
          generate_release_notes: false
          prerelease: ${{ inputs.prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
