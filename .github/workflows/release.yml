name: Release

# 设计约定（本地 CLI 触发 + 云端 CI/CD 打包）：
#   本地只负责：gh workflow run release.yml -f bump=...
#   版本号、tag、Win/Linux/macOS 构建、挂 Release 全部在 GitHub Actions 完成。
# 不用「push tag 触发另一条 workflow」：GITHUB_TOKEN 推送不会二次触发 CI（防递归）。

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本号递增类型'
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      resume_version:
        description: '恢复已完成版本提交的发布（例如 3.6.18）；留空则递增版本'
        type: string
        required: false
        default: ''
      prerelease:
        description: '标记为 Pre-release（测试包可勾选；正式版保持不勾）'
        type: boolean
        default: false
      dry_run:
        description: '试运行：算版本并构建，但不提交、不打 tag、不创建 Release'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Bump version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
      published: ${{ steps.bump.outputs.published }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute & write version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
          RESUME_VERSION: ${{ inputs.resume_version }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const path = require('path')

          const bumpType = (process.env.BUMP || 'patch').toLowerCase()
          const resumeVersion = String(process.env.RESUME_VERSION || '').trim()
          const dryRun = String(process.env.DRY_RUN).toLowerCase() === 'true'

          const pkgPath = path.join(process.cwd(), 'package.json')
          const lockPath = path.join(process.cwd(), 'package-lock.json')
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'))

          const cur = pkg.version
          const parts = String(cur).split('.').map(n => parseInt(n, 10))
          if (parts.length !== 3 || parts.some(n => !Number.isFinite(n) || n < 0)) {
            console.error('Invalid package.json version: ' + cur)
            process.exit(1)
          }

          let version
          if (resumeVersion) {
            if (!/^\d+\.\d+\.\d+$/.test(resumeVersion) || resumeVersion !== cur) {
              console.error(`Resume version must exactly match package.json (${cur})`)
              process.exit(1)
            }
            version = resumeVersion
          } else {
            let [maj, min, pat] = parts
            if (bumpType === 'major') { maj += 1; min = 0; pat = 0 }
            else if (bumpType === 'minor') { min += 1; pat = 0 }
            else if (bumpType === 'patch') { pat += 1 }
            else {
              console.error('Unsupported bump: ' + bumpType)
              process.exit(1)
            }
            version = [maj, min, pat].join('.')
          }

          const tag = 'v' + version

          // Release 文案必须独立于 commit 主题维护。缺少版本文案时，在任何
          // package 版本写入、commit 或 tag 之前失败，避免发布后再补文案。
          const notesPath = path.join(process.cwd(), '.github', 'release-notes', `${tag}.md`)
          if (!fs.existsSync(notesPath)) {
            console.error(`Missing editorial release notes: ${notesPath}`)
            process.exit(1)
          }
          const notes = fs.readFileSync(notesPath, 'utf8')
          const required = ['## 更新到 {{TAG}}', '<details>', '<summary>详细说明</summary>', '<!-- RELEASE_INSTALLERS -->', '<!-- RELEASE_CHANGELOG -->', '</details>']
          const missing = required.filter(marker => !notes.includes(marker))
          if (missing.length) {
            console.error('Release notes are missing required structure: ' + missing.join(', '))
            process.exit(1)
          }
          const highlights = notes.split('<details>')[0].split('\n').filter(line => /^-\s+\S/.test(line))
          if (highlights.length < 3 || highlights.length > 6) {
            console.error(`Release notes need 3–6 user-facing highlights (found ${highlights.length})`)
            process.exit(1)
          }

          if (!resumeVersion) {
            pkg.version = version
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n')

            if (fs.existsSync(lockPath)) {
              const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'))
              if ('version' in lock) lock.version = version
              if (lock.packages && lock.packages['']) lock.packages[''].version = version
              fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n')
            }
          }

          const out = process.env.GITHUB_OUTPUT || ''
          fs.appendFileSync(out, `version=${version}\n`)
          fs.appendFileSync(out, `tag=${tag}\n`)
          fs.appendFileSync(out, `published=${dryRun ? 'false' : 'true'}\n`)
          console.log(resumeVersion
            ? `Resuming release for existing version ${version}`
            : `Version: ${cur} -> ${version} (dry_run=${dryRun})`)
          NODE

      - name: Resolve previous tag
        id: prev
        env:
          NEW_TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          PREV=$(git describe --tags --abbrev=0 --exclude="${NEW_TAG}" 2>/dev/null || true)
          echo "prev_tag=${PREV}" >> "$GITHUB_OUTPUT"
          echo "Previous tag: ${PREV:-none}"

      - name: Commit & tag
        if: ${{ inputs.dry_run != true && inputs.resume_version == '' }}
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore(release): ${TAG} [skip ci]"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin HEAD
          git push origin "refs/tags/${TAG}"

      - name: Verify resumed tag
        if: ${{ inputs.dry_run != true && inputs.resume_version != '' }}
        env:
          TAG: ${{ steps.bump.outputs.tag }}
        run: git rev-parse --verify "refs/tags/${TAG}^{commit}" >/dev/null

      - name: Assemble editorial release notes
        if: ${{ inputs.dry_run != true }}
        id: notes
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          TAG: ${{ steps.bump.outputs.tag }}
          PREV_TAG: ${{ steps.prev.outputs.prev_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs')
          const tag = process.env.TAG
          const version = process.env.VERSION
          const repo = process.env.REPO
          const previousTag = process.env.PREV_TAG
          const sourcePath = `.github/release-notes/${tag}.md`
          let notes = fs.readFileSync(sourcePath, 'utf8')
          const installers = [
            '### 安装包', '',
            '| 平台 | 文件 |', '| --- | --- |',
            `| Windows x64 | \`isparta-next-${version}-win-x64.exe\` |`,
            `| Linux x64 | \`isparta-next-${version}-linux-x64.AppImage\` |`,
            `| macOS arm64（zip / pkg） | \`isparta-next-${version}-mac-arm64.zip\` / \`isparta-next-${version}-mac-arm64.pkg\` |`,
            `| macOS x64（zip / pkg） | \`isparta-next-${version}-mac-x64.zip\` / \`isparta-next-${version}-mac-x64.pkg\` |`,
            `| AE CEP Windows | \`isparta-next-${version}-cep-win.zip\` |`,
            `| AE CEP macOS | \`isparta-next-${version}-cep-mac.zip\` |`, '',
            '- Windows / Linux 安装版支持应用内更新；macOS 通过 pkg 安装，检测到 After Effects 时同步安装 CEP。',
            '- macOS 构建尚未签名，首次打开时可能需要在「系统设置 → 隐私与安全性」允许。',
            '- CEP zip 内含对应平台的安装说明与调试模式脚本。'
          ].join('\n')
          const changelog = previousTag
            ? `**完整变更记录**：https://github.com/${repo}/compare/${previousTag}...${tag}`
            : `**提交记录**：https://github.com/${repo}/commits/${tag}`
          notes = notes.replaceAll('{{TAG}}', tag)
            .replace('<!-- RELEASE_INSTALLERS -->', installers)
            .replace('<!-- RELEASE_CHANGELOG -->', changelog)
          if (/<!-- RELEASE_(INSTALLERS|CHANGELOG) -->/.test(notes)) {
            throw new Error('Release note placeholders were not fully assembled')
          }
          fs.writeFileSync('release-notes.md', notes)
          NODE

          echo "----- notes -----"
          cat release-notes.md

      - name: Upload release notes
        if: ${{ inputs.dry_run != true }}
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          retention-days: 7
          path: release-notes.md

  cep-payload:
    name: Build shared CEP payload
    needs: version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.published == 'true' && needs.version.outputs.tag || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install electron binary
        run: node node_modules/electron/install.js
      - name: Build CEP UI and payload
        run: |
          npm run build:cep
          npm run prepare:cep
      - name: Archive shared CEP payload
        run: tar -czf shared-cep-payload.tar.gz -C . build/cep-payload
      - name: Upload shared CEP payload
        uses: actions/upload-artifact@v4
        with:
          name: shared-cep-payload
          path: shared-cep-payload.tar.gz
          if-no-files-found: error
          retention-days: 14

  build:
    needs: [version, cep-payload]
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            flag: --win
          - os: ubuntu-latest
            platform: linux
            flag: --linux
          - os: macos-latest
            platform: mac
            flag: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.published == 'true' && needs.version.outputs.tag || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install electron binary
        run: node node_modules/electron/install.js

      - name: Download shared CEP payload
        uses: actions/download-artifact@v5
        with:
          name: shared-cep-payload
          path: .

      - name: Extract shared CEP payload
        run: tar -xzf shared-cep-payload.tar.gz

      - name: Doctor packaging assets
        run: node scripts/doctor-packaging.js

      - name: Build ${{ matrix.platform }}
        run: npx vue-cli-service electron:build ${{ matrix.flag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS unified installer
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          node scripts/build-mac-pkg.js --arch x64
          node scripts/build-mac-pkg.js --arch arm64

      - name: Collect & rename assets
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          mkdir -p release
          shopt -s nullglob
          # 安装包 + electron-updater 元数据
          # 注意：nullglob 只对通配符生效，不要写死 latest-linux.yml 等具体路径
          for f in \
            dist_electron/*.dmg \
            dist_electron/*.pkg \
            dist_electron/*.zip \
            dist_electron/*.tar.gz \
            dist_electron/*.exe \
            dist_electron/*.AppImage \
            dist_electron/latest*.yml \
            dist_electron/*.blockmap
          do
            [ -f "$f" ] || continue
            cp "$f" release/
          done
          count=$(ls -1 release 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" -eq 0 ]; then
            echo "No build artifacts found under dist_electron" >&2
            ls -la dist_electron || true
            exit 1
          fi
          appimage_old=""
          appimage_new=""
          for f in release/*; do
            base="$(basename "$f")"
            lower="$(echo "$base" | tr '[:upper:]' '[:lower:]')"
            # latest*.yml / blockmap 自身不改名；下方会同步修正 Linux 清单中的资产名。
            if [[ "$base" == latest*.yml || "$lower" == *.blockmap ]]; then
              continue
            fi
            if [[ "$lower" == *.tar.gz ]]; then
              ext="tar.gz"
            elif [[ "$lower" == *.appimage ]]; then
              ext="AppImage"
            else
              ext="${base##*.}"
            fi
            # artifactName 已含 version（isparta-next-${version}-${os}-${arch}.${ext}）
            # 若已是目标名则跳过，否则规范化
            if [[ "$PLATFORM" == "mac" ]]; then
              if [[ "$lower" == *arm64* ]]; then
                dest="isparta-next-${VERSION}-mac-arm64.${ext}"
              else
                dest="isparta-next-${VERSION}-mac-x64.${ext}"
              fi
            elif [[ "$PLATFORM" == "win" ]]; then
              dest="isparta-next-${VERSION}-win-x64.${ext}"
            else
              dest="isparta-next-${VERSION}-linux-x64.${ext}"
            fi
            if [[ "$base" != "$dest" ]]; then
              if [[ "$PLATFORM" == "linux" && "$ext" == "AppImage" ]]; then
                appimage_old="$base"
                appimage_new="$dest"
              fi
              mv "$f" "release/$dest"
            fi
          done
          if [[ -n "$appimage_old" && -f release/latest-linux.yml ]]; then
            sed -i "s|${appimage_old}|${appimage_new}|g" release/latest-linux.yml
          fi
          ls -lh release

      - name: Write macOS pkg update manifest
        if: matrix.platform == 'mac'
        run: node scripts/write-mac-pkg-manifest.js

      - name: Audit bundle size
        run: node scripts/audit-bundle-size.js --dir release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isparta-next-release-${{ needs.version.outputs.version }}-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: release/*

  # CEP 扩展 zip（W4）：Release 附带；命名与 build.yml 一致。
  # 约定（W3 NSIS 内嵌可直接复用同一布局 / targets/cep 源）：
  #   源目录  targets/cep/ + public/bin 小工具子集
  #   根目录  io.github.isparta-next/
  #   资产名  isparta-next-${version}-cep-${platform}.zip
  build-cep:
    name: Pack CEP (${{ matrix.platform }})
    needs: [version, cep-payload]
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win
            bin_plats: 'win32 win64'
          - platform: mac
            bin_plats: 'mac'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.version.outputs.published == 'true' && needs.version.outputs.tag || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'


      - name: Install dependencies (fresh)
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Install electron binary
        # --ignore-scripts 跳过了 electron postinstall；vue-cli 加载 electron-builder
        # 插件时 require('electron') 需要二进制已就位（与上方 Build 任务一致）
        run: node node_modules/electron/install.js

      - name: Download shared CEP payload
        uses: actions/download-artifact@v5
        with:
          name: shared-cep-payload
          path: .

      - name: Extract shared CEP payload
        run: tar -xzf shared-cep-payload.tar.gz

      - name: Pack CEP extension zip
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node scripts/pack-cep-zip.js --platform "$PLATFORM" --prepared
          mkdir -p release
          VERSION=$(node -p "require('./package.json').version")
          cp "dist/isparta-next-cep-${VERSION}-${PLATFORM}-x64.zip" "release/isparta-next-${VERSION}-cep-${PLATFORM}.zip"

      - name: Upload CEP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: isparta-next-release-${{ needs.version.outputs.version }}-cep-${{ matrix.platform }}
          if-no-files-found: error
          retention-days: 14
          path: release/*

  publish:
    name: Publish GitHub Release
    needs: [version, build, build-cep]
    if: needs.version.outputs.published == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Separate notes from installers
        run: |
          set -euo pipefail
          mkdir -p notes
          # 共用 CEP 载荷只在工作流任务间传递，不作为用户下载资产。
          if [ -f dist/shared-cep-payload.tar.gz ]; then
            rm dist/shared-cep-payload.tar.gz
          fi
          if [ -f dist/release-notes.md ]; then
            mv dist/release-notes.md notes/release-notes.md
          else
            cat > notes/release-notes.md <<EOF
          ## ${{ needs.version.outputs.tag }}

          Installers are attached below.
          EOF
          fi
          echo "Installers:"
          ls -lh dist
          echo "Notes head:"
          head -n 20 notes/release-notes.md

      # 稳定文件名别名：供落地页 releases/latest/download/<stable> 固定链接
      # electron-updater 走 latest*.yml 内的 versioned path，不依赖这些别名
      - name: Add stable-named aliases
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          VER="${VERSION}"
          copy_stable() {
            src="$1"; dest="$2"
            if [ -f "dist/$src" ]; then
              cp -f "dist/$src" "dist/$dest"
              echo "alias $src -> $dest"
            fi
          }
          # 自动更新主通道
          copy_stable "isparta-next-${VER}-win-x64.exe" "isparta-next-win-x64.exe"
          copy_stable "isparta-next-${VER}-linux-x64.AppImage" "isparta-next-linux-x64.AppImage"
          # 过渡：旧链接/未签名说明仍可能引用 zip / tar.gz
          copy_stable "isparta-next-${VER}-win-x64.zip" "isparta-next-win-x64.zip"
          copy_stable "isparta-next-${VER}-linux-x64.tar.gz" "isparta-next-linux-x64.tar.gz"
          copy_stable "isparta-next-${VER}-mac-arm64.zip" "isparta-next-mac-arm64.zip"
          copy_stable "isparta-next-${VER}-mac-x64.zip" "isparta-next-mac-x64.zip"
          copy_stable "isparta-next-${VER}-mac-arm64.pkg" "isparta-next-mac-arm64.pkg"
          copy_stable "isparta-next-${VER}-mac-x64.pkg" "isparta-next-mac-x64.pkg"
          # AE CEP 扩展包（解压到 CEP extensions；桌面 NSIS 内嵌由 W3 extraResources 负责）
          copy_stable "isparta-next-${VER}-cep-win.zip" "isparta-next-cep-win.zip"
          copy_stable "isparta-next-${VER}-cep-mac.zip" "isparta-next-cep-mac.zip"
          ls -lh dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          files: dist/*
          fail_on_unmatched_files: true
          body_path: notes/release-notes.md
          generate_release_notes: false
          prerelease: ${{ inputs.prerelease }}
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

