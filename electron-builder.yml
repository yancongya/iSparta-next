appId: io.github.isparta
asar: false
# 使用本地已安装的 Electron，避免打包时再下载 zip
electronDist: ./node_modules/electron/dist
electronVersion: 28.3.3
publish:
  - provider: github
win:
  # 无签名环境：跳过 rcedit / codesign 下载
  signAndEditExecutable: false
  target:
    - target: zip
      arch:
        - x64
  icon: ./public/icons/icon.ico
mac:
  # CI 无证书环境：不签名、不公证
  # macos-latest 无 /usr/bin/python，electron-builder@22 的 dmg 会 ENOENT，故用 zip
  identity: null
  target:
    - target: zip
      arch:
        - x64
        - arm64
  icon: ./public/icons/icon.icns
linux:
  target:
    - target: tar.gz
      arch:
        - x64
  icon: ./public/icons

