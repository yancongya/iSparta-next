appId: io.github.isparta-next
# productName 来自 package.json（唯一产品显示名）
# exe / 产物统一用 productName 小写前缀，与落地页下载链一致
executableName: isparta-next
# 必须带 ${version}：electron-updater 依赖 Release 上 latest*.yml 内的 path 与资产名一致
# CI 事后再改名会导致 updater 找不到包；稳定别名由 release.yml 额外 copy
artifactName: isparta-next-${version}-${os}-${arch}.${ext}
asar: false
# W3：AE CEP 扩展一体安装 payload（build/cep-payload 由 scripts/prepare-cep-payload.js 暂存）
# 落到 <resources>/cep/io.github.isparta-next，安装时由 NSIS 复制到 CEP 目录
extraResources:
  - from: build/cep-payload
    to: cep
    filter:
      - "**/*"
# 不配置 electronDist：electron-builder 22.14.13 的 unpack() 只在
# <dist>/electron-v<ver>-<platform>-<arch>.zip 存在时才按目标架构下载/解包；
# 否则会直接 copyDir 本地 node_modules/electron/dist（当前宿主架构），
# 导致 mac-x64 包实为 arm64（P0，影响 v3.3.16~v3.6.0）。
# 移除后按 platform+arch 走 unpack-electron，本地已有
# %LOCALAPPDATA%/electron/Cache 的 win32-x64 zip 缓存，不额外联网。
electronVersion: 28.3.3
publish:
  - provider: github
win:
  # CI（GitHub Actions）可下载 winCodeSign；开启后 NSIS 会写入 exe 图标与版本资源。
  # 本地网络无法下载 winCodeSign 时会失败，可临时改回 false 再本地出包。
  signAndEditExecutable: true
  target:
    # 自动更新通道：NSIS（zip 便携版 electron-updater 不支持）
    - target: nsis
      arch:
        - x64
  icon: ./public/icons/icon.ico
nsis:
  # 固定全机安装桌面版；仅在检测到 AE 时同步安装 CEP。
  # oneClick:true 直接安装；perMachine:true = 安装范围固定「所有用户」：
  #  · 模板自动下发 RequestExecutionLevel admin —— 安装器一启动就弹 UAC，
  #    用户授权后进程持有管理员令牌，才能写 Program Files / Common Files
  #  · initMultiUser 无条件置 $installMode="all"（/S 静默也一样，先于 customInit）
  #    → CEP 扩展恒定落系统级 Common Files，不再分叉到 %APPDATA% 用户级
  #  · 桌面自动更（electron-updater quitAndInstall）与 CEP 面板热更
  #    （launchInstaller）下载的是同一个 Release NSIS 包：两条通道都走 UAC、
  #    同包同作用域，不会一机器两份安装
  #  · installSection 对 installMode=all 自动 uninstallOldVersion HKCU：
  #    旧 per-user 副本（%LOCALAPPDATA%\Programs + HKCU 登记）被自动清除，
  #    全机只保留一份安装目录
  # 代价：每次安装/更新都会弹一次 UAC 授权（预期行为）。
  oneClick: true
  perMachine: true
  # NSIS 6010「函数未引用」是宏内 Call 的误报，会零化代码；关掉 warning-as-error
  warningsAsErrors: false
  allowToChangeInstallationDirectory: false
  # 首次安装完成后启动应用
  runAfterFinish: true
  # 开始菜单 / 卸载项显示名；安装目录随 package.json name= isparta-next
  shortcutName: iSparta-next
  uninstallDisplayName: iSparta-next
  # 向导侧栏（164×314 BMP）/ 页眉（150×57 BMP）— 品牌色
  installerSidebar: ./build/installerSidebar.bmp
  uninstallerSidebar: ./build/installerSidebar.bmp
  installerHeader: ./build/installerHeader.bmp
  # 一体安装：自动检测 AE，安装复制 CEP，并在卸载时清理
  include: ./build/installer.nsh
  # SignPath Foundation 免费签名（审核通过后在 CI 注入，勿把密钥写进仓库）：
  # win.sign: SignPath
mac:
  # CI 无证书环境：不签名、不公证。macOS 一体 pkg 由 scripts/build-mac-pkg.js
  # 从此处生成的 .app 组装；zip 保留给现有便携分发。
  identity: null
  target:
    - target: zip
      arch:
        - x64
        - arm64
  icon: ./public/icons/icon.icns
linux:
  target:
    # 自动更新通道：AppImage（tar.gz 无法免提权自动替换）
    - target: AppImage
      arch:
        - x64
  icon: ./public/icons
